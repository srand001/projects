<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stocks</title>
    <link rel="stylesheet" href="style/style.css" />
    <script src="scripts/script.js"></script>
  </head>
  <body>
    <header>
      <h1>Stock Market Prices</h1>
    </header>
    <main>
      <label for="searchInput">Search Stock Symbol</label>
      <input type="text" placeholder="Enter stock symbol" id="searchInput" maxlength="10"/>
      <button onclick="getUserSelectedStock()">Search</button>

      <table id="stock-table">
        <thead>
          <tr>
            <th>Stock Symbol</th>
            <th>Stock Price</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="stock-table-body">
          <!----
          <tr>
            <td>AAPL</td>
            <td>$123</td>
            <td>04/07/2026 09:00:00</td>
          </tr>
          ---->
        </tbody>
      </table>
    </main>

    <div class="modal" id="modal">
      <div class="modal-content">
        <span class="close-btn" id="close-btn">&times;</span>
        <ul id="stockPricesList"></ul>
      </div>
    </div>

    <script>
      displayInitialStocks();
    </script>

  </body>
</html>
