<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Weather App</title>
      <link rel="stylesheet" href="css/style.css">
   </head>
   <body>
      <div class="container">
         <div class="container2">
            <div class="search">
               <i class="fa-solid fa-location-dot"></i>
               <input type="text" placeholder="enter your location." class="input-val">
               <button id="searchButton" class="fa-solid fa-magnifying-glass"></button>
            </div>
         </div>
         <div class="not-found">
            <h3>Sorry. Location not found!!!</h3>
            <img src="images/not-found.png" alt="Not found">
         </div>
         <div class="display">
            <img src="images/rain.gif" alt="Weather Status" class="weather-status">
            <div class="weather-details">
               <p class="weather-data">0 <sup>°C</sup></p>
               <p class="weather-data2">Rainy</p>
            </div>
            <div class="weather-description">
               <div class="humidity">
                  <img src="images/humidity-unscreen.gif" alt="Humidity">
                  <div class="text">
                     <span id="humidity">30%</span>
                     <p>Humidity</p>
                  </div>
               </div>
               <div class="visibility">
                  <img src="images/vision-unscreen.gif" alt="visibility">
                  <div class="text1">
                     <span id="visibility">3 km</span>
                     <p>Visibility</p>
                  </div>
               </div>
               <div class="wind">
                  <img src="images/wind-unscreen.gif" alt="Wind Speed">
                  <div class="text3">
                     <span class="special" id="wind-speed">11 Km/H</span>
                     <p>Wind Speed</p>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <script src="https://kit.fontawesome.com/38b8bff489.js" crossorigin="anonymous"></script>
      <script src="scripts/script.js"></script>
   </body>
</html>
